name: Sportloto 4x20 frozen research audit

on:
  push:
    branches:
      - "research/sportloto-4x20-audit-20260902"
    paths:
      - ".research-sportloto/**"
      - ".github/workflows/sportloto-4x20-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportloto-4x20-research
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sparse checkout research files
        uses: actions/checkout@v4
        with:
          ref: research/sportloto-4x20-audit-20260902
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .research-sportloto

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --quiet numpy

      - name: Download latest verified official snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/Jokersochi/Jokersochi/main/public/loto-analytics-4x20/data/draws.json \
            -o .research-sportloto/draws.json
          python - <<'PY'
          import json
          p='.research-sportloto/draws.json'
          d=json.load(open(p))
          assert d.get('source') == 'official'
          assert d.get('quality',{}).get('continuous') is True
          assert not d.get('quality',{}).get('gaps')
          assert d.get('count') == len(d.get('draws',[]))
          print('Snapshot verified:', d['count'], d['first'], d['last'], d.get('retrievedAt'))
          PY

      - name: Validate 2025 GSC launch replication and controls
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_OUT: .research-sportloto/out
        run: |
          python .research-sportloto/gsc_launch_replication.py | tee .research-sportloto/gsc-launch-console.json

      - name: Test schedule changes as leading indicators
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_OUT: .research-sportloto/out
        run: |
          python .research-sportloto/schedule_transition_audit.py | tee .research-sportloto/schedule-transition-console.json

      - name: Probe live official archive head and extend frozen ledger
        continue-on-error: true
        shell: bash
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_HEAD: .research-sportloto/official-head-raw.json
          LOTO_OUT: .research-sportloto/out
        run: |
          set -euo pipefail
          curl -fGsS --retry 4 --retry-delay 2 \
            'https://www.stoloto.ru/p/api/mobile/api/v35/service/draws/archive' \
            -H 'accept: */*' \
            -H 'content-type: application/x-www-form-urlencoded' \
            -H 'device-platform: DESKTOP' \
            -H 'device-type: STOLOTO' \
            -H 'gosloto-partner: bXMjXFRXZ3coWXh6R3s1NTdUX3dnWlBMLUxmdg' \
            -H 'referer: https://www.stoloto.ru/4x20/archive' \
            -H 'user-agent: Mozilla/5.0 LotoOS-GitHub-Updater/1.0' \
            --data-urlencode 'game=4x20' \
            --data-urlencode 'count=50' \
            --data-urlencode 'page=1' \
            -o "$LOTO_HEAD"
          python .research-sportloto/official_head_probe.py | tee .research-sportloto/live-probe-console.json

      - name: Run frozen ledger and blind walk-forward audit
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_OUT: .research-sportloto/out
        run: |
          python .research-sportloto/sportloto_audit.py | tee .research-sportloto/out-console.json

      - name: Run multiplicity and nonlinear supplement
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_OUT: .research-sportloto/out
        run: |
          python .research-sportloto/sportloto_supplement.py | tee .research-sportloto/supplement-console.json

      - name: Validate lag signal with slot-preserving null and chronological holdout
        env:
          LOTO_ARCHIVE: .research-sportloto/draws.json
          LOTO_OUT: .research-sportloto/out
        run: |
          python .research-sportloto/sportloto_lag_validation.py | tee .research-sportloto/lag-validation-console.json

      - name: Upload reproducible audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: sportloto-4x20-audit-20260902
          path: |
            .research-sportloto/out/**
            .research-sportloto/out-console.json
            .research-sportloto/supplement-console.json
            .research-sportloto/lag-validation-console.json
            .research-sportloto/live-probe-console.json
            .research-sportloto/schedule-transition-console.json
            .research-sportloto/gsc-launch-console.json
          retention-days: 30
          if-no-files-found: error
